name: Automated Cloud Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw test

      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      - name: Build Docker image
        run: docker build -t sushil1321/automated-cloud-deployment:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SUSHIL1321 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push sushil1321/automated-cloud-deployment:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sushil1321/automated-cloud-deployment:latest
            docker stop automated-cloud-app || true
            docker rm automated-cloud-app || true
            docker run -d -p 8080:8080 --name automated-cloud-app sushil1321/automated-cloud-deployment:latest